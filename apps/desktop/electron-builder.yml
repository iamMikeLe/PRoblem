appId: app.problem.desktop
productName: PRoblem
directories:
  output: dist
  buildResources: build
# electron-vite bundles main, preload and renderer into out/; nothing else is needed at runtime.
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
  # Unsigned unless an identity is named: `pnpm release:mac` (see README, "Releasing") signs with
  # the identity in CSC_NAME, under the hardened runtime, and notarizes with APPLE_KEYCHAIN_PROFILE.
  # Never auto-discovered, so a machine with several certificates cannot sign with the wrong one.
  identity: null
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  target: nsis
linux:
  target: AppImage
